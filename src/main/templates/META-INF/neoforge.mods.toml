modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Merlin"
description = '''
HUD client-side de cooldown de magias para Iron's Spells 'n Spellbooks.
Mostra o tempo restante de cada magia depois de usa-la, com estilo, posicao,
cores e conteudo totalmente configuraveis pelo player.
'''

# Iron's Spells e a fonte dos dados de cooldown -- sem ele o mod nao tem o que mostrar.
#
# side = "CLIENT" combinado com zero payloads de rede registrados faz este mod ficar de fora
# da negociacao de mods do NeoForge. Ou seja: da pra entrar num servidor que NAO tem este mod
# instalado, que e exatamente o caso de uso.
[[dependencies.${mod_id}]]
    modId = "irons_spellbooks"
    type = "required"
    versionRange = "[1.21.1-3.16.0,)"
    # AFTER: o SpellRegistry do Iron's Spells precisa estar populado antes de resolvermos ids.
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    # Minimo suportado, nao a versao de compilacao: ver neo_version_range em gradle.properties.
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"
