modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Merlin"
description = '''
Client-side spell cooldown HUD for Iron's Spells 'n Spellbooks.
Shows the remaining cooldown of every spell after you cast it, with fully
configurable style, position, colors and content -- and a real cooldown that
stays accurate even when the server's TPS drops.
'''

# Iron's Spells is the source of the cooldown data -- without it there is nothing to show.
#
# side = "CLIENT" plus zero registered network payloads keeps this mod out of NeoForge's mod
# negotiation, so you can join a server that does NOT have it installed -- which is the whole point.
[[dependencies.${mod_id}]]
    modId = "irons_spellbooks"
    type = "required"
    versionRange = "[1.21.1-3.16.0,)"
    # AFTER: the Iron's Spells SpellRegistry must be populated before we resolve spell ids.
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    # Minimum supported, not the compile version: see neo_version_range in gradle.properties.
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"
