plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Instancia do CurseForge usada pela task 'deployToInstance'.
// Para usar outra instancia, defina instance_mods_dir no seu ~/.gradle/gradle.properties
// em vez de editar esta linha.
var instanceModsDir = findProperty('instance_mods_dir')
        ?: 'C:/Users/Merli/curseforge/minecraft/Instances/SMP  Somake Server/mods'

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Iron's Spells 'n Spellbooks e Iron's Lib, para compilar contra a API deles.
    //
    // Vem do Modrinth em vez de um jar em libs/ para o build funcionar em maquina limpa e no CI:
    // libs/*.jar esta no .gitignore (nao redistribuimos mods de terceiros), entao o runner do
    // GitHub nao teria contra o que compilar.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// Jars usados SO pelo dev client (runClient), que precisa do Iron's Spells rodando de verdade
// junto das 5 dependencias dele. Ausentes -- caso do CI --, o build segue normalmente: a
// compilacao nao depende deles, so a execucao.
var devRuntimeJars = [
        "libs/irons_spellbooks-${irons_spellbooks_version}.jar",
        "libs/irons_lib-${irons_lib_version}.jar",
        "libs/geckolib-neoforge-${geckolib_version}.jar",
        "libs/player-animation-lib-forge-${player_animation_version}.jar",
        "libs/curios-neoforge-${curios_version}.jar",
].collect { file(it) }

var accessTransformerFile = file('libs/irons_spellbooks_at.cfg')
var devClientReady = devRuntimeJars.every { it.exists() } && accessTransformerFile.exists()

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers do Iron's Spells 'n Spellbooks.
    //
    // O ModDevGradle aplica ATs no artefato do Minecraft em tempo de build. O AT de um mod que
    // esta apenas no runtime classpath NAO e aplicado sozinho -- sem isto, o Iron's Spells quebra
    // com IllegalAccessError logo no boot do dev client.
    //
    // O arquivo e uma copia sanitizada do AT que vem dentro do jar; veja o cabecalho dele.
    // So se aplica quando ha dev client montado: sem os jars locais nao ha o que transformar.
    if (devClientReady) {
        accessTransformers = project.files(accessTransformerFile)
    }

    // Este mod e client-only: nao ha run de server, gametest nem datagen.
    runs {
        client {
            client()
        }

        configureEach {
            // INFO em vez de DEBUG: com 6 mods carregando, DEBUG afoga o console.
            // Falhas de access transformer aparecem como IllegalAccessError em ERROR de qualquer jeito.
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // A API que este mod le (ClientMagicData, SpellRegistry, ...). compileOnly porque nao
    // republicamos a dependencia -- quem usa o mod ja tem o Iron's Spells instalado.
    compileOnly "maven.modrinth:irons-spells-n-spellbooks:${irons_spellbooks_version}"
    compileOnly "maven.modrinth:irons-lib:${irons_lib_version}"

    // As 5 dependencias exigidas pelo neoforge.mods.toml do Iron's Spells: sem todas elas o FML
    // recusa a carregar o mod e o dev client sobe sem magia nenhuma. Ficam em arquivos locais, e
    // nao no Modrinth, porque so o runClient precisa delas -- e assim um build sem libs/ (CI,
    // clone novo) nao tenta baixar 15 MB de mod a toa.
    if (devClientReady) {
        devRuntimeJars.each { localRuntime files(it) }
    }
}

// Copia o jar buildado direto pro mods/ da instancia do CurseForge, para testar contra o
// servidor real (unico lugar onde da pra validar as magias dos addons, ex. somakespells).
tasks.register('deployToInstance', Copy) {
    description = 'Copia o jar buildado para a instancia do CurseForge'
    group = 'spellcooldownhud'

    from tasks.named('jar')
    into instanceModsDir

    doLast {
        logger.lifecycle("Deploy OK -> ${instanceModsDir}")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
