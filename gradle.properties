# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Per-Minecraft-version values (Minecraft version, NeoForge, Parchment) are NOT here: they differ
# between 1.21 and 1.21.1 and live in the `when (minecraft_version)` block in build.gradle.kts.

# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier. Must be lowercase, must match the @Mod String constant.
mod_id=spellcooldownhud
# The human-readable display name for the mod.
mod_name=Spell Cooldown HUD
# The license of the mod.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.1.1
# The group ID, matching the base package used for the mod sources.
mod_group_id=com.merlin.spellcooldownhud

## Dependency versions (Iron's Spells 'n Spellbooks and its dependencies)
# The compileOnly deps (irons-spells-n-spellbooks and irons-lib) are per-node and live in the
# `nodeSpec` block in build.gradle.kts, because they differ by MC version/loader.
# The values below are dev-only libs (runClient), pulled from libs/. Copy those jars from the mods
# folder of a CurseForge instance that has Iron's Spells installed (see the README). These cover the
# 1.21.x dev client; the 1.20.1 dev client would need the matching 1.20.1 jars.
geckolib_version=1.21.1-4.8.3
player_animation_version=2.0.4+1.21.1
curios_version=9.5.1+1.21.1
